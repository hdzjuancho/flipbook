<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te haré saber que te amo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flipbook-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #0b0b0b;
        }

        .flipbook-container {
            box-shadow: 0 12px 50px rgba(0,0,0,0.8);
            background-color: #1a1a1a;
            width: 90vw;
            max-width: 1600px;
            aspect-ratio: 2048 / 576; 
            display: block;
        }

        @media (aspect-ratio < 2048/576) {
            .flipbook-container {
                width: 90vw;
                height: auto;
            }
        }
        @media (aspect-ratio >= 2048/576) {
            .flipbook-container {
                height: 85vh;
                width: auto;
            }
        }

        .my-page {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .my-page img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            display: block;
        }

        .page-color {
            width: 100%;
            height: 100%;
        }

        .my-page::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset -15px 0 40px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            z-index: 2;
        }

        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 10%;
            z-index: 2000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.15);
            font-size: 3rem;
            transition: background 0.3s, color 0.3s;
            user-select: none;
        }
        .click-zone:hover {
            color: rgba(255,255,255,0.7);
            background: rgba(255, 255, 255, 0.01);
        }
        .click-zone.left { left: 0; }
        .click-zone.right { right: 0; }

        /* MODIFICACIÓN DEL BOTÓN: Ahora es un contenedor cuadrado y minimalista */
        .fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 3000;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            width: 44px;  /* Ancho fijo para que sea perfectamente cuadrado */
            height: 44px; /* Alto fijo */
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center; /* Centra el icono perfectamente */
        }
        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .fullscreen-btn:active {
            transform: scale(0.95);
        }
        /* Hacemos el SVG un pelín más grande para que luzca bien solo */
        .fullscreen-btn svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="flipbook-viewport" id="viewport">
        <!-- El botón ahora solo contiene el elemento SVG del icono -->
        <button class="fullscreen-btn" id="btn-fullscreen" title="Pantalla completa">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16" id="fs-icon">
                <path d="M1.5 1v3a.5.5 0 0 0 1 0v-2h2a.5.5 0 0 0 0-1h-3zm13 0h-3a.5.5 0 0 0 0 1h2v2a.5.5 0 0 0 1 0v-3zM1.5 15h3a.5.5 0 0 0 0-1h-2v-2a.5.5 0 0 0-1 0v3zm13 0v-3a.5.5 0 0 0-1 0v2h-2a.5.5 0 0 0 0 1h3z"/>
            </svg>
        </button>

        <div class="click-zone left" id="btn-prev">‹</div>
        <div class="click-zone right" id="btn-next">›</div>

        <div id="flipbook" class="flipbook-container">
            <div class="my-page"><div class="page-color" style="background-color: #FF2121;"></div></div>
            <div class="my-page"><div class="page-color" style="background-color: #FFFFFF;"></div></div>

            <div class="my-page"><img src="pages/001.jpg" alt="Pág 1"></div>
            <div class="my-page"><img src="pages/002.jpg" alt="Pág 2"></div>
            <div class="my-page"><img src="pages/003.jpg" alt="Pág 3"></div>
            <div class="my-page"><img src="pages/004.jpg" alt="Pág 4"></div>
            <div class="my-page"><img src="pages/005.jpg" alt="Pág 5"></div>
            <div class="my-page"><img src="pages/006.jpg" alt="Pág 6"></div>
            <div class="my-page"><img src="pages/007.jpg" alt="Pág 7"></div>
            <div class="my-page"><img src="pages/008.jpg" alt="Pág 8"></div>
            <div class="my-page"><img src="pages/009.jpg" alt="Pág 9"></div>
            <div class="my-page"><img src="pages/010.jpg" alt="Pág 10"></div>
            <div class="my-page"><img src="pages/011.jpg" alt="Pág 11"></div>
            <div class="my-page"><img src="pages/012.jpg" alt="Pág 12"></div>
            <div class="my-page"><img src="pages/013.jpg" alt="Pág 13"></div>
            <div class="my-page"><img src="pages/014.jpg" alt="Pág 14"></div>
            <div class="my-page"><img src="pages/015.jpg" alt="Pág 15"></div>
            <div class="my-page"><img src="pages/016.jpg" alt="Pág 16"></div>
            <div class="my-page"><img src="pages/017.jpg" alt="Pág 17"></div>
            <div class="my-page"><img src="pages/018.gif" alt="Pág 18"></div>
            <div class="my-page"><img src="pages/019.gif" alt="Pág 19"></div>
            <div class="my-page"><img src="pages/020.gif" alt="Pág 20"></div>
            <div class="my-page"><img src="pages/021.jpg" alt="Pág 21"></div>
            <div class="my-page"><img src="pages/022.jpg" alt="Pág 22"></div>
            <div class="my-page"><img src="pages/023.jpg" alt="Pág 23"></div>
            <div class="my-page"><img src="pages/024.jpg" alt="Pág 24"></div>
            <div class="my-page"><img src="pages/025.jpg" alt="Pág 25"></div>
            <div class="my-page"><img src="pages/026.jpg" alt="Pág 26"></div>
            <div class="my-page"><img src="pages/027.jpg" alt="Pág 27"></div>
            <div class="my-page"><div class="page-color" style="background-color: #FF2121;"></div></div>
        </div>
    </div>

    <audio id="flip-sound" src="page-flip.mp3" preload="auto"></audio>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <script>
        window.addEventListener('load', function() {
            const htmlElement = document.getElementById('flipbook');
            const viewport = document.getElementById('viewport');
            const audio = document.getElementById('flip-sound');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            const fsIcon = document.getElementById('fs-icon');

            const pageFlip = new St.PageFlip(htmlElement, {
                width: 1024,         
                height: 576,         
                size: "stretch",     
                minWidth: 320,
                maxWidth: 2000,
                minHeight: 180,
                maxHeight: 1200,
                drawShadow: true,    
                showCover: true,     
                usePortrait: false   
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));

            btnFullscreen.addEventListener('click', () => {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (viewport.requestFullscreen) {
                        viewport.requestFullscreen();
                    } else if (viewport.webkitRequestFullscreen) {
                        viewport.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                }
            });

            const updateFullscreenUI = () => {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    // Cambia al icono de "des-maximizar"
                    btnFullscreen.title = "Salir de pantalla completa";
                    fsIcon.innerHTML = `<path d="M5.5 0a.5.5 0 0 1 .5.5v4A1.5 1.5 0 0 1 4.5 6h-4a.5.5 0 0 1 0-1h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 1 .5-.5zm5 0a.5.5 0 0 1 .5.5v4a.5.5 0 0 0 .5.5h4a.5.5 0 0 1 0 1h-4A1.5 1.5 0 0 1 10 4.5v-4a.5.5 0 0 1 .5-.5zM0 10.5a.5.5 0 0 1 .5-.5h4A1.5 1.5 0 0 1 6 11.5v4a.5.5 0 0 1-1 0v-4a.5.5 0 0 0-.5-.5h-4a.5.5 0 0 1-.5-.5zm10 1a1.5 1.5 0 0 1 1.5-1.5h4a.5.5 0 0 1 0 1h-4a.5.5 0 0 0-.5.5v4a.5.5 0 0 1-1 0v-4z"/>`;
                } else {
                    // Cambia al icono de "maximizar" original
                    btnFullscreen.title = "Pantalla completa";
                    fsIcon.innerHTML = `<path d="M1.5 1v3a.5.5 0 0 0 1 0v-2h2a.5.5 0 0 0 0-1h-3zm13 0h-3a.5.5 0 0 0 0 1h2v2a.5.5 0 0 0 1 0v-3zM1.5 15h3a.5.5 0 0 0 0-1h-2v-2a.5.5 0 0 0-1 0v3zm13 0v-3a.5.5 0 0 0-1 0v2h-2a.5.5 0 0 0 0 1h3z"/>`;
                }
                
                setTimeout(() => {
                    pageFlip.update(); 
                }, 150);
            };

            document.addEventListener('fullscreenchange', updateFullscreenUI);
            document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

            window.addEventListener('resize', () => {
                pageFlip.update();
            });

            // Sonidos e interacción
            let lastSoundTime = 0;
            function playSoundInstant() {
                const now = Date.now();
                if (now - lastSoundTime > 300) {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log("Audio esperando interacción"));
                    lastSoundTime = now;
                }
            }

            document.getElementById('btn-prev').addEventListener('mousedown', () => {
                if (pageFlip.getState() === 'read') { playSoundInstant(); pageFlip.flipPrev(); }
            });
            document.getElementById('btn-next').addEventListener('mousedown', () => {
                if (pageFlip.getState() === 'read') { playSoundInstant(); pageFlip.flipNext(); }
            });

            document.getElementById('btn-prev').addEventListener('touchstart', () => {
                if (pageFlip.getState() === 'read') { playSoundInstant(); pageFlip.flipPrev(); }
            });
            document.getElementById('btn-next').addEventListener('touchstart', () => {
                if (pageFlip.getState() === 'read') { playSoundInstant(); pageFlip.flipNext(); }
            });

            document.addEventListener('keydown', (e) => {
                if (pageFlip.getState() !== 'read') return;
                if (e.key === 'ArrowRight' || e.key === 'd') { playSoundInstant(); pageFlip.flipNext(); }
                if (e.key === 'ArrowLeft' || e.key === 'a') { playSoundInstant(); playSoundInstant(); pageFlip.flipPrev(); }
            });

            htmlElement.addEventListener('mousedown', (e) => {
                if (pageFlip.getState() !== 'read') return;
                const rect = htmlElement.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                if (clickX < rect.width * 0.25 || clickX > rect.width * 0.75) {
                    playSoundInstant();
                }
            });

            htmlElement.addEventListener('touchstart', (e) => {
                if (pageFlip.getState() !== 'read') return;
                const rect = htmlElement.getBoundingClientRect();
                const clickX = e.touches[0].clientX - rect.left;
                if (clickX < rect.width * 0.25 || clickX > rect.width * 0.75) {
                    playSoundInstant();
                }
            });
        });
    </script>
</body>
</html>
