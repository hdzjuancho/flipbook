<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Te haré saber que te amo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flipbook-viewport {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 
           CORRECCIÓN CSS: El contenedor ahora respeta la proporción de doble página.
           Si una hoja es 1024x576, el libro abierto (2 hojas) mide 2048x576.
           La relación de aspecto exacta para el contenedor es 32:9.
        */
        .flipbook-container {
            box-shadow: 0 12px 50px rgba(0,0,0,0.8);
            background-color: #1a1a1a;
            width: 95vw;
            aspect-ratio: 32 / 9; /* Mantiene la proporción perfecta en cualquier pantalla */
            max-width: 1400px; 
            display: block;
        }

        .my-page {
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* Obligatorio para posicionar la sombra superpuesta */
        }

        /* La imagen ahora cubrirá el contenedor sin deformarse */
        .my-page img {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            display: block;
        }

        .page-color {
            width: 100%;
            height: 100%;
        }

        /* 
           DEGRADADO DEL CENTRO A LA IZQUIERDA (INTEGRADO)
           Capa protectora que fuerza el box-shadow exacto por encima de imágenes y colores.
        */
        .my-page::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Tu sombra exacta aplicada desde el borde derecho hacia el interior izquierdo */
            box-shadow: inset -15px 0 40px rgba(0, 0, 0, 0.3);
            pointer-events: none; /* Evita bloquear los clics y arrastres del flipbook */
            z-index: 2; /* Se posiciona por encima de la etiqueta img */
        }

        /* Zonas interactivas */
        .click-zone {
            position: absolute;
            top: 0;
            height: 100%;
            width: 10%;
            z-index: 2000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.15);
            font-size: 3rem;
            transition: background 0.3s, color 0.3s;
            user-select: none;
        }
        .click-zone:hover {
            color: rgba(255,255,255,0.7);
            background: rgba(255, 255, 255, 0.01);
        }
        .click-zone.left { left: 0; }
        .click-zone.right { right: 0; }
    </style>
</head>
<body>

    <div class="flipbook-viewport">
        <div class="click-zone left" id="btn-prev">‹</div>
        <div class="click-zone right" id="btn-next">›</div>

        <div id="flipbook" class="flipbook-container">
            <!-- Tus páginas secuenciales -->
            <div class="my-page"><img src="pages/001.jpg" alt="Pág 1"></div>
            <div class="my-page"><img src="pages/002.jpg" alt="Pág 2"></div>
            <div class="my-page"><img src="pages/003.jpg" alt="Pág 3"></div>
            <div class="my-page"><img src="pages/004.jpg" alt="Pág 4"></div>
            <div class="my-page"><img src="pages/005.jpg" alt="Pág 5"></div>
            <div class="my-page"><img src="pages/006.jpg" alt="Pág 6"></div>
            <div class="my-page"><img src="pages/007.jpg" alt="Pág 7"></div>
            <div class="my-page"><img src="pages/008.jpg" alt="Pág 8"></div>
            <div class="my-page"><img src="pages/009.jpg" alt="Pág 9"></div>
            <div class="my-page"><img src="pages/010.jpg" alt="Pág 10"></div>
            <div class="my-page"><img src="pages/011.jpg" alt="Pág 11"></div>
            <div class="my-page"><img src="pages/012.jpg" alt="Pág 12"></div>
            <div class="my-page"><img src="pages/013.jpg" alt="Pág 13"></div>
            <div class="my-page"><img src="pages/014.jpg" alt="Pág 14"></div>
            <div class="my-page"><img src="pages/015.jpg" alt="Pág 15"></div>
            <div class="my-page"><img src="pages/016.jpg" alt="Pág 16"></div>
            <div class="my-page"><img src="pages/017.jpg" alt="Pág 17"></div>
            <div class="my-page"><img src="pages/018.gif" alt="Pág 18"></div>
            <div class="my-page"><img src="pages/019.gif" alt="Pág 19"></div>
            <div class="my-page"><img src="pages/020.gif" alt="Pág 20"></div>
            <div class="my-page"><img src="pages/021.jpg" alt="Pág 21"></div>
            <div class="my-page"><img src="pages/022.jpg" alt="Pág 22"></div>
            <div class="my-page"><img src="pages/023.jpg" alt="Pág 23"></div>
            <div class="my-page"><img src="pages/024.jpg" alt="Pág 24"></div>
            <div class="my-page"><img src="pages/025.jpg" alt="Pág 25"></div>
            <div class="my-page"><img src="pages/026.jpg" alt="Pág 26"></div>
            <div class="my-page"><img src="pages/027.jpg" alt="Pág 27"></div>
            <div class="my-page"><div class="page-color" style="background-color: #FF2121;"></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

    <script>
        window.addEventListener('load', function() {
            const htmlElement = document.getElementById('flipbook');

            // CORRECCIÓN JAVASCRIPT: Ajustamos las dimensiones base al tamaño real de una sola hoja (1024x576)
            const pageFlip = new St.PageFlip(htmlElement, {
                width: 1024,         
                height: 576,         
                size: "stretch",     
                minWidth: 400,
                maxWidth: 1600,
                minHeight: 225,
                maxHeight: 900,
                drawShadow: true,    
                showCover: true,     
                usePortrait: false   
            });

            pageFlip.loadFromHTML(document.querySelectorAll('.my-page'));

            // Navegación
            document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
            document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowRight' || e.key === 'd') pageFlip.flipNext();
                if (e.key === 'ArrowLeft' || e.key === 'a') pageFlip.flipPrev();
            });
        });
    </script>
</body>
</html>
